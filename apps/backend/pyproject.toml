[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nutriward-backend"
version = "0.1.0"
description = "NutriWard backend bootstrap"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "sqlmodel>=0.0.22",
  "sqlalchemy>=2.0.30",
  "alembic>=1.13.2",
  "psycopg[binary]>=3.2.0",
  "python-dotenv>=1.0.1",
  "pydantic-settings>=2.4.0",
  "PyJWT>=2.9.0",
  "pwdlib[argon2]>=0.2.1"
]

[project.optional-dependencies]
test = [
  "httpx2>=2.9.0",
  "pytest>=8.3.0"
]

[tool.ruff]
line-length = 100

[tool.setuptools.packages.find]
include = ["app*"]
