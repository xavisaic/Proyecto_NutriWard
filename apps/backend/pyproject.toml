[project]
name = "nutriward-backend"
version = "0.1.0"
description = "NutriWard backend bootstrap"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "sqlmodel>=0.0.22",
  "sqlalchemy>=2.0.30",
  "alembic>=1.13.2",
  "psycopg[binary]>=3.2.0",
  "python-dotenv>=1.0.1",
  "pydantic-settings>=2.4.0"
]

[tool.ruff]
line-length = 100
